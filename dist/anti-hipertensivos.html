<title>Anti-hipertensivos</title>
<style>
/* =================================================================
   Anti-hipertensivos — folha de estilo
   Sistema visual: papel clínico, tipografia editorial, acento por classe
   ================================================================= */

/* ---------- Tokens ---------- */
:root {
  color-scheme: light;

  --paper:      #EDE8E0;
  --paper-2:    #E2DCD1;
  --surface:    #F8F5EF;
  --surface-2:  #F2EEE6;
  --ink:        #27221C;
  --ink-2:      #48433D;
  --muted:      #5D5852;
  --faint:      #6C6761;
  --line:       #DED7CA;
  --line-soft:  #E8E2D8;

  --danger:     #A32029;
  --warn:       #8A6512;
  --ok:         #2A6E57;

--shadow-sm: 0 1px 2px rgba(58, 48, 34, .06);
  --shadow-md: 0 2px 4px rgba(58, 48, 34, .06), 0 8px 20px -12px rgba(58, 48, 34, .20);
  --shadow-lg: 0 8px 40px -12px rgba(58, 48, 34, .28);

  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 26px;

  --wrap: 680px;
  --pad: clamp(16px, 4.5vw, 24px);

  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  /* acento neutro; cada bloco .acc redefine --c e deriva os tons abaixo */
  --c: var(--ink);
  --c-txt: var(--ink);
  --c-wash: color-mix(in srgb, var(--ink) 7%, transparent);
  --c-edge: color-mix(in srgb, var(--ink) 20%, transparent);
}

/* Tons derivados do acento. Precisam ser declarados no próprio elemento que
   define --c: propriedades customizadas são resolvidas onde são declaradas,
   então herdar "--c-txt: var(--c)" da raiz devolveria sempre a cor da raiz. */
.acc {
  --c-txt: var(--c-l, var(--c));
  --c-wash: color-mix(in srgb, var(--c) 9%, transparent);
  --c-edge: color-mix(in srgb, var(--c) 26%, transparent);
}

html[data-theme="dark"] {
  color-scheme: dark;

  --paper:      #1A1D20;
  --paper-2:    #22262B;
  --surface:    #23272C;
  --surface-2:  #2A2F35;
  --ink:        #F1EDE7;
  --ink-2:      #D8D4CE;
  --muted:      #BEBAB4;
  --faint:      #A8A49E;
  --line:       #40464E;
  --line-soft:  #32373E;

  --danger:     #F0908A;
  --warn:       #E8BC63;
  --ok:         #72CDAC;

--shadow-sm: 0 1px 2px rgba(0, 0, 0, .34);
  --shadow-md: 0 2px 4px rgba(0, 0, 0, .26), 0 8px 24px -14px rgba(0, 0, 0, .66);
  --shadow-lg: 0 10px 44px -12px rgba(0, 0, 0, .58);

  --c-txt: var(--ink);
  --c-wash: color-mix(in srgb, var(--ink) 10%, transparent);
  --c-edge: color-mix(in srgb, var(--ink) 24%, transparent);
}

html[data-theme="dark"] .acc {
  --c-txt: var(--c-d, var(--c));
  --c-wash: color-mix(in srgb, var(--c) 17%, transparent);
  --c-edge: color-mix(in srgb, var(--c) 40%, transparent);
}

/* Sem escolha explícita, segue o sistema. Necessário porque o app pode ser
   embutido em um hospedeiro que não carimba data-theme na raiz. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --paper:      #1A1D20;
    --paper-2:    #22262B;
    --surface:    #23272C;
    --surface-2:  #2A2F35;
    --ink:        #F1EDE7;
    --ink-2:      #D8D4CE;
    --muted:      #BEBAB4;
    --faint:      #A8A49E;
    --line:       #40464E;
    --line-soft:  #32373E;

    --danger:     #F0908A;
    --warn:       #E8BC63;
    --ok:         #72CDAC;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .34);
    --shadow-md: 0 2px 4px rgba(0, 0, 0, .26), 0 8px 24px -14px rgba(0, 0, 0, .66);
    --shadow-lg: 0 10px 44px -12px rgba(0, 0, 0, .58);

    --c-txt: var(--ink);
    --c-wash: color-mix(in srgb, var(--ink) 10%, transparent);
    --c-edge: color-mix(in srgb, var(--ink) 24%, transparent);
  }
  :root:not([data-theme="light"]) .acc {
    --c-txt: var(--c-d, var(--c));
    --c-wash: color-mix(in srgb, var(--c) 17%, transparent);
    --c-edge: color-mix(in srgb, var(--c) 40%, transparent);
  }
}

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-wrap: break-word;
  min-height: 100dvh;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
}

button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; text-align: left; }
ul { list-style: none; padding: 0; }
strong { font-weight: 650; }

:focus-visible {
  outline: 2px solid var(--c-txt);
  outline-offset: 2px;
  border-radius: 4px;
}

::selection { background: color-mix(in srgb, var(--danger) 22%, transparent); }

/* ---------- Estrutura ---------- */
.wrap {
  max-width: var(--wrap);
  margin-inline: auto;
  padding-inline: var(--pad);
}

.stack > * + * { margin-top: 10px; }

/* ---------- Cabeçalho ---------- */
.hero {
  padding-top: calc(22px + env(safe-area-inset-top));
  padding-bottom: 18px;
}

.hero-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.brand-mark {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: 7px;
}

.brand-mark svg { display: block; }

h1 {
  font-family: var(--font-display);
  font-size: clamp(30px, 8.6vw, 40px);
  font-weight: 600;
  line-height: 1.02;
  letter-spacing: -.022em;
}

.hero-sub {
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.45;
  color: var(--muted);
  max-width: 46ch;
}

.icon-btn {
  width: 40px;
  height: 40px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  box-shadow: var(--shadow-sm);
  transition: transform .15s, color .15s, border-color .15s;
}
.icon-btn:active { transform: scale(.92); }
.icon-btn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 22%, transparent); }

/* seletor de assunto clínico, acima do título */
.seg-assunto {
  max-width: 300px;
  margin-bottom: 18px;
  font-size: 13px;
}
.seg-assunto button { padding: 9px 6px; }

/* faixa cromática dos estágios, sob o cabeçalho */
.ruler-strip {
  display: flex;
  height: 3px;
  border-radius: 999px;
  overflow: hidden;
  margin-top: 18px;
}
.ruler-strip span { flex: 1; }

/* ---------- Cartões ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-sm);
}

.card-pad { padding: 18px; }

.section-title {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -.012em;
  line-height: 1.2;
}

.eyebrow {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--faint);
}

.tab-intro {
  margin: 2px 0 14px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--muted);
}

/* ---------- Régua de estágios ---------- */
.stage {
  display: grid;
  grid-template-columns: 8px minmax(0, 1fr);
  gap: 0 11px;
  padding: 11px 0;
  border-top: 1px solid var(--line-soft);
}
.stage:first-of-type { border-top: 0; padding-top: 2px; }

.stage-dot {
  width: 8px; height: 8px;
  border-radius: 999px;
  margin-top: 6px;
  background: var(--c);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent);
}

.stage-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 10px;
}
.stage-name { font-size: 13.5px; font-weight: 640; }
.stage-range {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--c-txt);
  background: var(--c-wash);
  padding: 1px 7px;
  border-radius: 999px;
  white-space: nowrap;
}
.stage-note { font-size: 12.5px; line-height: 1.45; color: var(--muted); margin-top: 3px; }

.footnote {
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--faint);
  margin-top: 14px;
  padding-top: 13px;
  border-top: 1px solid var(--line-soft);
}

/* ---------- Limiares de início ---------- */
.thr {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 11px;
  align-items: start;
  padding: 10px 0;
  border-top: 1px solid var(--line-soft);
}
.thr:first-of-type { border-top: 0; padding-top: 0; }
.thr-pa {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 650;
  white-space: nowrap;
  color: var(--c-txt);
  background: var(--c-wash);
  border: 1px solid var(--c-edge);
  border-radius: 999px;
  padding: 3px 9px;
  margin-top: 1px;
  min-width: 116px;
  text-align: center;
}
.thr-txt { font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }

/* ---------- Meta ---------- */
.target {
  margin-top: 18px;
  padding: 16px;
  border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--danger) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--danger) 22%, transparent);
}
.target-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--danger); }
.target-value {
  font-family: var(--font-display);
  font-size: 34px;
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1.1;
  color: var(--danger);
  margin-top: 4px;
}
.target-note { font-size: 12.5px; line-height: 1.5; color: var(--muted); margin-top: 6px; }

/* ---------- Escada de escalonamento ---------- */
.steps { counter-reset: step; margin-top: 4px; }
.step {
  position: relative;
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: 12px;
  padding-bottom: 16px;
}
.step:last-child { padding-bottom: 0; }
.step::before {
  counter-increment: step;
  content: counter(step);
  grid-column: 1;
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 999px;
  font-size: 12px; font-weight: 700;
  font-family: var(--font-mono);
  color: var(--danger);
  background: color-mix(in srgb, var(--danger) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--danger) 24%, transparent);
}
.step::after {
  content: "";
  position: absolute;
  left: 13px; top: 30px; bottom: 2px;
  width: 1px;
  background: var(--line);
}
.step:last-child::after { display: none; }
.step-name { font-size: 14px; font-weight: 640; line-height: 1.3; }
.step-txt { font-size: 13px; line-height: 1.5; color: var(--muted); margin-top: 2px; }

/* ---------- Busca ---------- */
.search-bar {
  position: sticky;
  top: 0;
  z-index: 30;
  padding: 10px 0 12px;
  background: linear-gradient(var(--paper) 86%, transparent);
}
.search-field {
  position: relative;
  display: flex;
  align-items: center;
}
.search-field svg {
  position: absolute;
  left: 14px;
  color: var(--faint);
  pointer-events: none;
}
.search-field input {
  width: 100%;
  padding: 12px 40px 12px 40px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  font-size: 14.5px;
  outline: none;
  transition: border-color .16s, box-shadow .16s;
}
.search-field input::placeholder { color: var(--faint); }
.search-field input:focus {
  border-color: color-mix(in srgb, var(--ink) 34%, transparent);
  box-shadow: var(--shadow-md);
}
.search-clear {
  position: absolute;
  right: 8px;
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: 999px;
  color: var(--faint);
}
.search-clear:hover { color: var(--ink); background: var(--paper-2); }

/* ---------- Chips ---------- */
.chips {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px var(--pad) 14px;
  margin-inline: calc(var(--pad) * -1);
  scroll-snap-type: x proximity;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  scroll-snap-align: start;
  padding: 7px 13px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 550;
  white-space: nowrap;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  transition: background .16s, color .16s, border-color .16s, transform .12s;
}
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
  font-weight: 600;
}

/* ---------- Cartão de classe ---------- */
.klass {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--c);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: box-shadow .2s, border-color .2s;
}
.klass.is-open { box-shadow: var(--shadow-md); }

.klass-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: start;
  width: 100%;
  padding: 15px 15px 15px 16px;
}
.klass-group {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .11em;
  text-transform: uppercase;
  color: var(--c-txt);
}
.klass-name {
  font-size: 15.5px;
  font-weight: 640;
  line-height: 1.25;
  letter-spacing: -.008em;
  margin-top: 3px;
}
.klass-preview {
  font-size: 12.5px;
  line-height: 1.4;
  color: var(--muted);
  margin-top: 5px;
}
.klass-aside { display: flex; align-items: center; gap: 8px; padding-top: 2px; }

.tag-first {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .07em;
  padding: 3px 6px;
  border-radius: 5px;
  color: var(--c-txt);
  background: var(--c-wash);
  border: 1px solid var(--c-edge);
  white-space: nowrap;
}

.caret {
  width: 26px; height: 26px;
  flex: none;
  display: grid; place-items: center;
  border-radius: 999px;
  color: var(--muted);
  background: var(--paper-2);
  transition: transform .28s cubic-bezier(.4, 0, .2, 1), background .2s, color .2s;
}
.klass.is-open .caret {
  transform: rotate(180deg);
  background: var(--c-wash);
  color: var(--c-txt);
}

/* acordeão animado */
.klass-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .32s cubic-bezier(.4, 0, .2, 1);
}
.klass.is-open .klass-body { grid-template-rows: 1fr; }
.klass-body > div { overflow: hidden; }
.klass-inner {
  padding: 4px 16px 18px;
  border-top: 1px solid var(--line-soft);
  margin-top: 2px;
}

.blk { margin-top: 15px; }
.blk-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .11em;
  text-transform: uppercase;
  color: var(--c-txt);
  margin-bottom: 7px;
}
.blk-title.is-danger { color: var(--danger); }
.blk-title.is-muted { color: var(--faint); }
.blk p { font-size: 13.5px; line-height: 1.58; color: var(--ink-2); }
.blk li {
  position: relative;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--ink-2);
  padding-left: 15px;
}
.blk li + li { margin-top: 6px; }
.blk li::before {
  content: "";
  position: absolute;
  left: 2px; top: 9px;
  width: 4px; height: 4px;
  border-radius: 999px;
  background: var(--c-txt);
  opacity: .55;
}
.blk.is-danger li::before { background: var(--danger); }

.pearl {
  margin-top: 18px;
  padding: 14px 15px;
  border-radius: var(--r-sm);
  background: var(--c-wash);
  border: 1px solid var(--c-edge);
}
.pearl-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .11em;
  text-transform: uppercase;
  color: var(--c-txt);
  margin-bottom: 6px;
}
.pearl p { font-size: 13.5px; line-height: 1.6; color: var(--ink); }

/* ---------- Calculadora de risco ---------- */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
  gap: 12px;
  margin-top: 14px;
}
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label {
  font-size: 11px;
  font-weight: 650;
  letter-spacing: .02em;
  color: var(--muted);
}
.field .unit { font-weight: 500; color: var(--faint); }
.field input {
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  outline: none;
  transition: border-color .16s, background .16s;
}
.field input:focus { border-color: var(--ink); background: var(--surface); }
.field input:invalid { border-color: var(--danger); }
.field input::-webkit-outer-spin-button,
.field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.field input[type=number] { -moz-appearance: textfield; }

/* controle segmentado (sexo) */
.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 3px;
  padding: 3px;
  border-radius: 999px;
  background: var(--paper-2);
  border: 1px solid var(--line);
}
.seg button {
  padding: 8px 4px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  color: var(--muted);
  transition: background .16s, color .16s;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

/* interruptores de sim/não */
.toggles { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
.toggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 13px 8px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 13px;
  font-weight: 550;
  color: var(--muted);
  transition: background .16s, color .16s, border-color .16s;
}
.toggle .box {
  width: 17px; height: 17px;
  border-radius: 5px;
  border: 1.5px solid var(--line);
  display: grid;
  place-items: center;
  color: transparent;
  transition: background .16s, border-color .16s, color .16s;
}
.toggle[aria-pressed="true"] {
  background: color-mix(in srgb, var(--danger) 9%, transparent);
  border-color: color-mix(in srgb, var(--danger) 34%, transparent);
  color: var(--ink);
}
.toggle[aria-pressed="true"] .box {
  background: var(--danger);
  border-color: var(--danger);
  color: #FFFFFF;
}

/* atalho da creatinina */
.helper-line {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
}
.helper-line .field { flex: 1 1 130px; }
.helper-btn {
  padding: 10px 14px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
  transition: color .16s, border-color .16s;
}
.helper-btn:hover { color: var(--ink); border-color: var(--ink); }
.helper-note { font-size: 11.5px; line-height: 1.5; color: var(--faint); margin-top: 8px; }

/* resultado */
.result {
  margin-top: 10px;
  border-radius: var(--r-md);
  border: 1px solid var(--c-edge);
  background: var(--c-wash);
  padding: 18px;
}
.result-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.result-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--c-txt); }
.result-value {
  font-family: var(--font-display);
  font-size: 46px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -.025em;
  color: var(--c-txt);
  font-variant-numeric: tabular-nums;
  margin-top: 6px;
}
.result-band {
  font-size: 12.5px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--c-txt);
  color: var(--paper);
  white-space: nowrap;
}
.result-model {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  margin-top: 9px;
  letter-spacing: .01em;
}
.result-scale { display: flex; gap: 3px; margin-top: 16px; }
.result-scale div {
  flex: 1;
  height: 5px;
  border-radius: 999px;
  background: currentColor;
  opacity: .22;
  transition: opacity .2s, transform .2s;
}
.result-scale div.on { opacity: 1; transform: scaleY(1.6); }
.result-scale-rot {
  display: flex;
  justify-content: space-between;
  font-size: 9.5px;
  font-weight: 600;
  color: var(--muted);
  margin-top: 7px;
}
.result-secondary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
  margin-top: 18px;
  padding-top: 15px;
  border-top: 1px solid var(--c-edge);
}
.result-secondary dt { font-size: 11px; font-weight: 600; color: var(--muted); line-height: 1.3; }
.result-secondary dd {
  font-size: 21px;
  font-weight: 650;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  margin: 3px 0 0;
}
.result-action {
  margin-top: 16px;
  padding: 13px 14px;
  border-radius: var(--r-sm);
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--ink);
}
.result-warn {
  margin-top: 12px;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--danger);
  font-weight: 550;
}
.result-empty {
  margin-top: 10px;
  padding: 28px 18px;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
  color: var(--faint);
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
}

/* ---------- Combinações ---------- */
.combo {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--c);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-sm);
  padding: 15px 16px;
}
.combo-title {
  font-size: 15px;
  font-weight: 640;
  line-height: 1.28;
}
.combo-txt { font-size: 13.5px; line-height: 1.58; color: var(--muted); margin-top: 6px; }
.combo-ex {
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  color: var(--c-txt);
  margin-top: 11px;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
}

.group-label {
  color: var(--c-txt);
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 22px 0 10px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.group-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}
.group-label:first-child { margin-top: 0; }

/* ---------- Listas (perfis / EV) ---------- */
.rows { overflow: hidden; }
.row {
  padding: 14px 16px;
  border-top: 1px solid var(--line-soft);
}
.row:first-child { border-top: 0; }
.row-title { font-size: 13.5px; font-weight: 640; line-height: 1.3; }
.row-main { font-size: 13.5px; line-height: 1.45; color: var(--danger); margin-top: 4px; }
.row-note { font-size: 12.5px; line-height: 1.45; color: var(--muted); margin-top: 3px; }

/* ---------- Aviso ---------- */
.notice {
  background: var(--surface);
  border: 1px solid color-mix(in srgb, var(--danger) 26%, var(--line));
  border-left: 3px solid var(--danger);
  border-radius: var(--r-md);
  padding: 15px 16px;
  box-shadow: var(--shadow-sm);
}
.notice .eyebrow { color: var(--danger); }
.notice p { font-size: 13.5px; line-height: 1.58; color: var(--ink-2); margin-top: 8px; }

/* ---------- Vazio ---------- */
.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--faint);
  font-size: 13.5px;
}
.empty svg { margin: 0 auto 12px; display: block; opacity: .5; }

/* ---------- Rodapé ---------- */
.foot {
  margin-top: 30px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--faint);
}
.foot-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.ghost-btn {
  font-size: 12px;
  font-weight: 600;
  padding: 7px 13px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  transition: color .16s, border-color .16s, transform .12s;
}
.ghost-btn:active { transform: scale(.96); }
.ghost-btn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 24%, transparent); }

/* ---------- Navegação inferior ---------- */
.tabbar {
  position: fixed;
  left: 50%;
  bottom: calc(10px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 60;
  width: min(calc(100% - 16px), 520px);
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 2px;
  padding: 6px;
  border-radius: var(--r-xl);
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
}

.tab {
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 7px 2px 6px;
  border-radius: 18px;
  color: var(--faint);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: -.005em;
  text-align: center;
  transition: color .18s, background .18s, transform .12s;
}
.tab svg { display: block; }
.tab:active { transform: scale(.94); }
.tab[aria-selected="true"] {
  color: var(--ink);
  background: var(--paper-2);
}
html[data-theme="dark"] .tab[aria-selected="true"] { background: var(--surface-2); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tab[aria-selected="true"] { background: var(--surface-2); }
}

/* ---------- Painéis ---------- */
[hidden] { display: none !important; }
.panel { animation: rise .3s cubic-bezier(.2, .7, .3, 1) both; }
@keyframes rise {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: none; }
}

/* ---------- Folha de instalação (iOS) ---------- */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(10, 12, 15, .45);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
  display: grid;
  align-items: end;
  animation: fade .2s ease both;
}
.sheet {
  width: min(100%, 480px);
  margin: 0 auto;
  background: var(--surface);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding: 22px var(--pad) calc(26px + env(safe-area-inset-bottom));
  box-shadow: var(--shadow-lg);
  animation: slide-up .28s cubic-bezier(.2, .7, .3, 1) both;
}
.sheet h2 { font-family: var(--font-display); font-size: 21px; font-weight: 600; margin-bottom: 4px; }
.sheet p { font-size: 13.5px; line-height: 1.6; color: var(--muted); }
.sheet ol { margin: 14px 0 0; padding-left: 20px; font-size: 13.5px; line-height: 1.7; color: var(--ink-2); }
.sheet ol li::marker { color: var(--faint); font-variant-numeric: tabular-nums; }
.sheet-close {
  width: 100%;
  margin-top: 20px;
  padding: 13px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--paper);
  font-size: 14.5px;
  font-weight: 620;
  text-align: center;
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes slide-up { from { transform: translateY(100%) } to { transform: none } }

/* ---------- Larguras maiores ---------- */
@media (min-width: 720px) {
  body { font-size: 15.5px; }
  :root { --wrap: 880px; }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    align-items: start;
  }
  .grid-2 > * { margin-top: 0 !important; }
}

/* ---------- Impressão ---------- */
@media print {
  body { padding: 0; background: #fff; }
  .tabbar, .search-bar, .chips, .icon-btn, .foot-row { display: none !important; }
  .klass-body { grid-template-rows: 1fr !important; }
  .panel { animation: none; display: block !important; }
  [hidden] { display: block !important; }
}

/* ---------- Movimento reduzido ---------- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* =================================================================
   PREVENT — Predicting Risk of cardiovascular disease EVENTs
   American Heart Association (Khan SS et al., Circulation 2023).
   Adotado pela Diretriz Brasileira de Hipertensão Arterial 2025
   como a ferramenta de estratificação de risco cardiovascular.

   Quatro variantes, escolhidas pelo que o usuário informar:
     base   — nem HbA1c nem relação albumina/creatinina
     hba1c  — só HbA1c
     uacr   — só relação albumina/creatinina (RAC)
     full   — os dois

   O índice de privação social (SDI) nunca é usado: ele depende de CEP dos
   Estados Unidos. As equações foram ajustadas com indicador de ausência,
   então entra como "SDI ausente", que é o comportamento previsto no modelo.

   Centralização, conforme a publicação original:
     idade 55 · não-HDL 3,5 mmol/L · HDL 1,3 mmol/L · PAS 130
     IMC 25 · TFGe 90 — e, nos termos em spline, o valor do nó.
   ================================================================= */

const PREVENT_LIMITES = {
  idade: [30, 79],
  pas: [90, 180],
  colesterolTotal: [130, 320],
  hdl: [20, 100],
  tfg: [15, 140],
  imc: [18.5, 39.9],
  hba1c: [4, 15],
  rac: [1, 5000],
};

/* mg/dL -> mmol/L para colesterol */
const paraMmol = (mgdl) => mgdl * 0.02586;

/* CKD-EPI 2021, sem coeficiente de raça — para estimar a TFG a
   partir da creatinina, quando ela não vier pronta do laboratório. */
function tfgCkdEpi2021({ creatinina, idade, sexo }) {
  const fem = sexo === "F";
  const k = fem ? 0.7 : 0.9;
  const a = fem ? -0.241 : -0.302;
  const r = creatinina / k;
  return (
    142 *
    Math.pow(Math.min(r, 1), a) *
    Math.pow(Math.max(r, 1), -1.2) *
    Math.pow(0.9938, idade) *
    (fem ? 1.012 : 1)
  );
}

/* Monta o vetor de preditores. `anos` = 10 ou 30. */
function preditoresPrevent(p, anos) {
  // O IMC tem coeficiente zero nos desfechos DCV total e ASCVD — ele só pesa
  // no modelo de insuficiência cardíaca, que este app não exibe. Por isso o
  // formulário não pede IMC; o valor de centralização entra como neutro.
  if (typeof p.imc !== "number") p = { ...p, imc: 25 };
  const idade = (p.idade - 55) / 10;
  const naoHdl = paraMmol(p.colesterolTotal - p.hdl) - 3.5;
  const hdl = (paraMmol(p.hdl) - 1.3) / 0.3;
  const pasBaixa = (Math.min(p.pas, 110) - 110) / 20;
  const pasAlta = (Math.max(p.pas, 110) - 130) / 20;
  const imcBaixo = (Math.min(p.imc, 30) - 25) / 5;
  const imcAlto = (Math.max(p.imc, 30) - 30) / 5;
  const tfgBaixa = (Math.min(p.tfg, 60) - 60) / -15;
  const tfgAlta = (Math.max(p.tfg, 60) - 90) / -15;
  const dm = p.diabetes ? 1 : 0;
  const fumo = p.fumante ? 1 : 0;
  const antiHas = p.usaAntiHipertensivo ? 1 : 0;
  const estatina = p.usaEstatina ? 1 : 0;

  const v = {
    age: idade,
    nonHdl: naoHdl,
    hdl: hdl,
    sbpLt110: pasBaixa,
    sbpGte110: pasAlta,
    dm: dm,
    fumo: fumo,
    bmiLt30: imcBaixo,
    bmiGte30: imcAlto,
    egfrLt60: tfgBaixa,
    egfrGte60: tfgAlta,
    antiHas: antiHas,
    estatina: estatina,
    antiHasSbp: antiHas * pasAlta,
    estatinaNonHdl: estatina * naoHdl,
    ageNonHdl: idade * naoHdl,
    ageHdl: idade * hdl,
    ageSbpGte110: idade * pasAlta,
    ageDm: idade * dm,
    ageFumo: idade * fumo,
    ageBmiGte30: idade * imcAlto,
    ageEgfrLt60: idade * tfgBaixa,
    const: 1,
  };
  if (anos === 30) v.ageSq = idade * idade;

  /* Termos das variantes. Cada exame ausente entra como zero somado ao seu
     indicador de ausência — foi assim que as equações foram ajustadas. */
  const temHba1c = Number.isFinite(p.hba1c);
  const temRac = Number.isFinite(p.rac);

  v.hba1cDm = temHba1c && dm === 1 ? p.hba1c - 5.3 : 0;
  v.hba1cSemDm = temHba1c && dm === 0 ? p.hba1c - 5.3 : 0;
  v.semHba1c = temHba1c ? 0 : 1;

  v.lnRac = temRac ? Math.log(p.rac) : 0;
  v.semRac = temRac ? 0 : 1;

  /* O SDI só existe para CEP dos EUA. `sdiDecil` é aceito apenas para
     reproduzir os casos de referência publicados; o app nunca o informa. */
  const decil = p.sdiDecil;
  v.sdi46 = decil >= 4 && decil <= 6 ? 1 : 0;
  v.sdi710 = decil >= 7 && decil <= 10 ? 1 : 0;
  v.semSdi = Number.isFinite(decil) ? 0 : 1;

  return v;
}

/* Qual variante usar, dado o que foi informado. */
function modeloPrevent(p) {
  const h = Number.isFinite(p.hba1c);
  const r = Number.isFinite(p.rac);
  if (h && r) return "full";
  if (h) return "hba1c";
  if (r) return "uacr";
  return "base";
}

const NOME_MODELO = {
  base: "modelo base",
  hba1c: "refinado com HbA1c",
  uacr: "refinado com albuminúria",
  full: "refinado com HbA1c e albuminúria",
};

function aplicarBetas(betas, preds) {
  let lp = 0;
  for (const termo in betas) {
    const x = preds[termo];
    if (x === undefined) throw new Error("preditor ausente: " + termo);
    lp += betas[termo] * x;
  }
  return Math.exp(lp) / (1 + Math.exp(lp));
}

/* Faixas de risco adotadas pela DBHA 2025, aplicadas ao risco de
   doença aterosclerótica (ASCVD) em 10 anos. */
const FAIXAS_RISCO = [
  { ate: 5, rot: "Baixo", cor: "#2E8B6F" },
  { ate: 7.5, rot: "Limítrofe", cor: "#C9A227" },
  { ate: 20, rot: "Intermediário", cor: "#D97A1F" },
  { ate: Infinity, rot: "Alto", cor: "#B3242F" },
];

const faixaDe = (pct) => FAIXAS_RISCO.find((f) => pct < f.ate);

/* Retorna { ascvd10, dcv10, dcv30, faixa, avisos[] } em pontos percentuais. */
function calcularPrevent(p) {
  const avisos = [];
  for (const campo in PREVENT_LIMITES) {
    const [min, max] = PREVENT_LIMITES[campo];
    const v = p[campo];
    if (typeof v === "number" && (v < min || v > max)) {
      avisos.push(`${campo} fora da faixa validada (${min}–${max})`);
    }
  }

  const s = p.sexo === "F" ? "f" : "m";
  const m = modeloPrevent(p);
  const p10 = preditoresPrevent(p, 10);
  const p30 = preditoresPrevent(p, 30);

  const ascvd10 = aplicarBetas(PREVENT_BETAS[`${m}_10_${s}_ascvd`], p10) * 100;
  const dcv10 = aplicarBetas(PREVENT_BETAS[`${m}_10_${s}_cvd`], p10) * 100;
  const dcv30 = aplicarBetas(PREVENT_BETAS[`${m}_30_${s}_cvd`], p30) * 100;

  return {
    ascvd10, dcv10, dcv30,
    faixa: faixaDe(ascvd10),
    modelo: m, nomeModelo: NOME_MODELO[m],
    avisos,
  };
}

if (typeof module !== "undefined") {
  module.exports = { calcularPrevent, tfgCkdEpi2021, preditoresPrevent, modeloPrevent, FAIXAS_RISCO };
}

const $ = (sel, root = document) => root.querySelector(sel);

const esc = (s) =>
  String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
  );

/* remove acentos e caixa, para a busca perdoar digitação no celular */
const norm = (s) =>
  String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

const store = {
  get(k, fb) {
    try { const v = localStorage.getItem("ah:" + k); return v === null ? fb : JSON.parse(v); }
    catch { return fb; }
  },
  set(k, v) {
    try { localStorage.setItem("ah:" + k, JSON.stringify(v)); } catch { /* modo privado */ }
  },
};

/* ---------- acentos legíveis ---------- */
/* Cada classe, estágio e veredito tem uma cor de identidade. Ela funciona como
   trilha e como ponto colorido, mas como TEXTO várias delas não alcançam
   contraste suficiente — o dourado sobre papel claro é o caso extremo. Em vez
   de escolher cores novas à mão, deriva-se de cada acento uma variante de
   texto para cada tema, escurecendo ou clareando só o necessário. */
const _hex = (h) => { h = h.replace("#", ""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); };
const _lin = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
const _lum = (c) => 0.2126 * _lin(c[0]) + 0.7152 * _lin(c[1]) + 0.0722 * _lin(c[2]);
const _contraste = (a, b) => {
  const la = _lum(a), lb = _lum(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
};
const _misturar = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const _paraHex = (c) => "#" + c.map((v) => v.toString(16).padStart(2, "0")).join("");

/* Pior caso de cada tema: no claro o acento pode cair sobre o papel, mais
   escuro que o cartão; no escuro, sobre o campo de formulário, mais claro. */
const SUP_CLARA = "#EDE8E0";
const SUP_ESCURA = "#2A2F35";

function _legivel(base, fundo, rumo, alvo) {
  for (let t = 0; t <= 1.0001; t += 0.02) {
    const c = _misturar(base, rumo, t);
    if (_contraste(c, fundo) >= alvo) return _paraHex(c);
  }
  return _paraHex(rumo);
}

const _cacheAcento = {};

/* Devolve as três variáveis inline: identidade, texto no claro, texto no escuro. */
function acento(cor) {
  if (_cacheAcento[cor]) return _cacheAcento[cor];
  const base = _hex(cor);
  // o texto costuma cair sobre o próprio fundo lavado, mais escuro que o cartão
  const fundoClaro = _misturar(_hex(SUP_CLARA), base, 0.09);
  const fundoEscuro = _misturar(_hex(SUP_ESCURA), base, 0.17);
  /* No tema escuro a mesma razão de contraste é percebida como mais fraca que
     no claro, então o acento como texto é levado a 7:1 em vez do mínimo. */
  const claro = _legivel(base, fundoClaro, [0, 0, 0], 4.5);
  const escuro = _legivel(base, fundoEscuro, [255, 255, 255], 7.0);
  return (_cacheAcento[cor] = `--c:${cor};--c-l:${claro};--c-d:${escuro}`);
}

function filtrar() {
  const q = norm(state.busca.trim());
  return CLASSES.filter((c) => {
    if (state.grupo !== "Todos" && c.grupo !== state.grupo) return false;
    if (!q) return true;
    const alvo = norm(
      [c.nome, c.grupo, c.drogas.join(" "), c.indicacoes.join(" "),
       c.contraindicacoes.join(" "), c.mecanismo, c.adversos, c.pearl].join(" ")
    );
    return q.split(/\s+/).every((t) => alvo.includes(t));
  });
}

function renderListaClasses() {
  const lista = filtrar();
  const alvo = $("#lista-classes");
  const limpar = $("#search-clear");
  if (limpar) limpar.hidden = !state.busca;
  if (!lista.length) {
    alvo.innerHTML = `<div class="empty">${ICON.empty}
      Nenhuma classe corresponde a essa busca.<br>Tente outro termo.</div>`;
    return;
  }
  alvo.innerHTML = lista.map(cardClasse).join("");
}

/* ---------- aba: risco ---------- */
function riscoCompleto() {
  return CAMPOS_RISCO.every((c) => Number.isFinite(parseFloat(risco[c.k])));
}

function entradasRisco() {
  const n = (k) => parseFloat(risco[k]);
  return {
    sexo: risco.sexo,
    idade: n("idade"), pas: n("pas"),
    colesterolTotal: n("colesterolTotal"), hdl: n("hdl"), tfg: n("tfg"),
    diabetes: risco.diabetes, fumante: risco.fumante,
    usaAntiHipertensivo: risco.usaAntiHipertensivo, usaEstatina: risco.usaEstatina,
    // vazios viram NaN, que o cálculo trata como exame não informado
    hba1c: n("hba1c"), rac: n("rac"),
  };
}

/* O que o risco calculado significa para a decisão de tratar, cruzando com a PA. */
function conduta(faixa, pas) {
  if (pas >= 140) {
    return "Com PA ≥ 140/90 o tratamento medicamentoso começa no diagnóstico, qualquer que seja o risco calculado.";
  }
  if (pas >= 130) {
    return faixa === "Alto"
      ? "Na faixa 130–139/80–89 com risco alto, entra medicação se a PA não controlar após três meses de medidas não farmacológicas."
      : "Na faixa 130–139/80–89 sem risco alto, a conduta é de medidas não medicamentosas, com reavaliação periódica do risco.";
  }
  return "Abaixo de 130/80 a conduta é de medidas não medicamentosas e controle dos demais fatores de risco.";
}

    </dl>

    <div class="result-action">${esc(conduta(r.faixa.rot, e.pas))}</div>
    ${r.avisos.length
      ? `<div class="result-warn">Fora da faixa validada: ${esc(r.avisos.join("; "))}. O resultado deixa de ser confiável.</div>`

  <div id="risco-resultado">${resultadoRiscoHTML()}</div>

  <p class="footnote" style="border:0;padding-top:14px">
    PREVENT (Khan SS et al., <em>Circulation</em> 2023). Informar os dois exames aciona o modelo completo, que inclui um termo de privação social baseado em CEP dos Estados Unidos — aqui ele entra como desconhecido, valor que a equação calibra perto da média da população. Por isso esse resultado não é comparável ao de uma calculadora americana alimentada com CEP. As faixas — baixo &lt; 5%, limítrofe 5 a 7,5%, intermediário 7,5 a 20%, alto ≥ 20% — são as da diretriz, aplicadas ao risco de doença aterosclerótica em 10 anos. Nada do que você digita aqui é salvo.
  </p>`;
}

/* ---------- assunto sem conteúdo ainda ---------- */
function viewEmBreve() {
  return `<div class="card card-pad" style="text-align:center;padding:38px 22px">
    <div class="eyebrow" style="margin-bottom:12px">Em preparação</div>
    <p style="font-size:14.5px;line-height:1.6;color:var(--ink);margin:0 auto;max-width:36ch">
      A estrutura está pronta e esperando o conteúdo: classes e doses, o
      algoritmo de escolha por risco cardiovascular, IMC e HbA1c, metas e
      quando começar insulina.
    </p>
    <p style="font-size:12.5px;line-height:1.55;color:var(--faint);margin:16px auto 0;max-width:40ch">
      O conteúdo de hipertensão deste guia foi escrito a quatro mãos com quem
      estuda, não gerado automaticamente. O de diabetes segue o mesmo caminho.
    </p>
  </div>`;
}

/* ---------- render ---------- */
const VIEWS = {
  "dm-inicio": viewEmBreve,
  inicio: viewInicio,
  risco: viewRisco,
  classes: viewClasses,
  combos: viewCombos,
  perfis: viewPerfis,
  emerg: viewEmerg,
};

function renderCabecalho() {
  const a = ASSUNTOS[state.assunto];
  $("#brand-fonte").textContent = a.fonte;
  $("#titulo").innerHTML = esc(a.titulo);
  $("#subtitulo").textContent = a.sub;
  $("#ruler").hidden = !a.regua;
  $("#aviso").textContent = a.rodape;
  $("#seletor-assunto").innerHTML = Object.entries(ASSUNTOS)
    .map(([id, v]) => `<button data-assunto="${id}" aria-pressed="${id === state.assunto}">${esc(v.rot)}</button>`)
    .join("");
}

function renderBarra() {
  $("#tabbar").innerHTML = abas()
    .map((t) => `<button class="tab" role="tab" data-aba="${t.id}"
             aria-selected="${t.id === state.aba}" aria-controls="painel">
      ${t.icon}<span>${esc(t.rot)}</span></button>`)
    .join("");
}

function renderAba() {
  $("#painel").innerHTML = `<div class="panel">${VIEWS[state.aba]()}</div>`;
  if (state.aba === "classes") {
    renderListaClasses();
    $("#busca").value = state.busca;
  }
  document.querySelectorAll(".tab").forEach((b) => {
    b.setAttribute("aria-selected", String(b.dataset.aba === state.aba));
  });
  store.set("aba", state.aba);
}

function irParaAssunto(id) {
  if (state.assunto === id) return;
  state.assunto = id;
  store.set("assunto", id);
  state.aba = abas()[0].id;
  state.aberto = null;
  state.busca = "";
  renderCabecalho();
  renderBarra();
  renderAba();
  scrollTo({ top: 0 });
}

function irPara(id) {
  if (state.aba === id) {
    scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  state.aba = id;
  renderAba();
  scrollTo({ top: 0 });
}

/* ---------- montagem ---------- */
function montar() {
  $("#ruler").innerHTML = ESTAGIOS.map(
    (e) => `<span style="background:${e.cor}"></span>`
  ).join("");

  $("#brand-icon").innerHTML = ICON.logo;
  aplicarTema(temaAtual());
  renderCabecalho();
  renderBarra();
  renderAba();
}

/* ---------- eventos ---------- */
document.addEventListener("click", (ev) => {
  const bt = ev.target.closest("[data-assunto]");
  if (bt) return irParaAssunto(bt.dataset.assunto);

  const tab = ev.target.closest(".tab");
  if (tab) return irPara(tab.dataset.aba);

  const chip = ev.target.closest(".chip");
  if (chip) {
    state.grupo = chip.dataset.grupo;
    store.set("grupo", state.grupo);
    document.querySelectorAll(".chip").forEach((c) =>
      c.setAttribute("aria-pressed", String(c.dataset.grupo === state.grupo))
    );
    state.aberto = null;
    renderListaClasses();
    return;
  }

  const head = ev.target.closest(".klass-head");
  if (head) {
    const art = head.closest(".klass");
    const id = art.dataset.id;
    const abrindo = state.aberto !== id;
    state.aberto = abrindo ? id : null;
    renderListaClasses();
    if (abrindo) {
      const novo = document.querySelector(`.klass[data-id="${id}"]`);
      const y = novo.getBoundingClientRect().top + scrollY - 12;
      if (novo.getBoundingClientRect().top < 0) scrollTo({ top: y, behavior: "smooth" });
    }
    return;
  }

  const btSexo = ev.target.closest("[data-sexo]");
  if (btSexo) {
    risco.sexo = btSexo.dataset.sexo;
    document.querySelectorAll("[data-sexo]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.sexo === risco.sexo))
    );
    redesenharResultadoRisco();
    return;
  }

  const marca = ev.target.closest("[data-marca]");
  if (marca) {
    const k = marca.dataset.marca;
    risco[k] = !risco[k];
    marca.setAttribute("aria-pressed", String(risco[k]));
    redesenharResultadoRisco();
    return;
  }

  if (ev.target.closest("#calc-tfg")) {
    const cr = parseFloat(risco.creatinina);
    const idade = parseFloat(risco.idade);
    if (!Number.isFinite(cr) || !Number.isFinite(idade)) {
      alert("Para estimar a TFG preciso da creatinina e da idade.");
      return;
    }
    const v = tfgCkdEpi2021({ creatinina: cr, idade, sexo: risco.sexo });
    risco.tfg = String(Math.round(v));
    $("#r-tfg").value = risco.tfg;
    redesenharResultadoRisco();
    return;
  }

  if (ev.target.closest("#search-clear")) {
    state.busca = "";
    renderListaClasses();
    $("#busca").value = "";
    $("#busca").focus();
    return;
  }

  if (ev.target.closest("#theme-toggle")) {
    const novo = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    store.set("tema", novo);
    aplicarTema(novo);
    return;
  }

  if (ev.target.closest("#btn-instalar")) return instalar();

  if (ev.target.closest("#sheet-close") || ev.target.id === "sheet-backdrop") {
    $("#sheet-backdrop")?.remove();
  }
});

function redesenharResultadoRisco() {
  const alvo = $("#risco-resultado");
  if (alvo) alvo.innerHTML = resultadoRiscoHTML();
}

document.addEventListener("input", (ev) => {
  const campo = ev.target.dataset && ev.target.dataset.risco;
  if (campo) {
    risco[campo] = ev.target.value;
    redesenharResultadoRisco();
    return;
  }
  if (ev.target.id === "busca") {
    state.busca = ev.target.value;
    state.aberto = null;
    renderListaClasses();
  }
});

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") {
    if ($("#sheet-backdrop")) return $("#sheet-backdrop").remove();
    if (document.activeElement?.id === "busca") {
      state.busca = "";
      $("#busca").value = "";
      renderListaClasses();
    }
  }
});

/* ---------- instalação ---------- */
let promptInstalacao = null;

addEventListener("beforeinstallprompt", (ev) => {
  ev.preventDefault();
  promptInstalacao = ev;
  const b = $("#btn-instalar");
  if (b) b.hidden = false;
});

addEventListener("appinstalled", () => {
  promptInstalacao = null;
  const b = $("#btn-instalar");
  if (b) b.hidden = true;
});

async function instalar() {
  if (promptInstalacao) {
    promptInstalacao.prompt();
    await promptInstalacao.userChoice;
    promptInstalacao = null;
    $("#btn-instalar").hidden = true;
    return;
  }
  document.body.insertAdjacentHTML(
    "beforeend",
    `<div class="sheet-backdrop" id="sheet-backdrop" role="dialog" aria-modal="true" aria-label="Como instalar">
      <div class="sheet">
        <h2>Deixe no celular</h2>
        <p>Instalado, o guia abre em tela cheia e funciona sem internet.</p>
        <ol>
          <li><strong>iPhone / iPad:</strong> toque em Compartilhar e depois em “Adicionar à Tela de Início”.</li>
          <li><strong>Android:</strong> menu do navegador e depois “Instalar aplicativo” ou “Adicionar à tela inicial”.</li>
          <li><strong>Computador:</strong> ícone de instalar na barra de endereço.</li>
        </ol>
        <button class="sheet-close" id="sheet-close">Entendi</button>
      </div>
    </div>`
  );
}

/* modo instalado: esconde o convite */
if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) {
  addEventListener("DOMContentLoaded", () => {
    const b = $("#btn-instalar");
    if (b) b.hidden = true;
  });
}

/* ---------- tema do sistema muda ---------- */
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
  if (store.get("tema", null) === null) aplicarTema(e.matches ? "dark" : "light");
});

montar();
</script>
</body>
</html>
